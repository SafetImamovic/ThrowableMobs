// Pure-Java physics math (launch, drag, impact, catch geometry). No Minecraft dependencies, so it is
// unit-testable on its own and shared by every target: compiled into the loader jars like `common`,
// and later into the Paper plugin.
plugins {
    id 'java-library'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation(platform("org.junit:junit-bom:${junit_version}"))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

// Sources are UTF-8; Java 17 would read them in the system encoding, which on Windows isn't.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

configurations {
    physicsJava {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    physicsJava sourceSets.main.java.sourceDirectories.singleFile
}
