modLoader = "javafml" #mandatory
loaderVersion = "${forge_loader_version_range}" #mandatory
license = "${license}" # Review your options at https://choosealicense.com/.
issueTrackerURL="${issues}"
[[mods]] #mandatory
modId = "${mod_id}" #mandatory
version = "${version}" #mandatory
displayName = "${mod_name}" #mandatory
displayURL="${homepage}"
logoFile="${mod_id}_banner.png" #optional
credits="${credits}" #optional
authors = "${mod_author}" #optional
description = '''${description}''' #mandatory (Supports multiline text)
# Mixin configs are listed in the jar manifest (MixinConfigs) on Forge 1.20.1, not here.
[[dependencies.${mod_id}]] #optional
modId = "forge" #mandatory
mandatory = true #mandatory
versionRange = "${forge_version_range}" #mandatory
ordering = "NONE" # The order that this dependency should load in relation to your mod, required to be either 'BEFORE' or 'AFTER' if the dependency is not mandatory
side = "BOTH" # Side this dependency is applied on - 'BOTH', 'CLIENT' or 'SERVER'
[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
# Optional: with it, the mod has a config screen (YACL's).
[[dependencies.${mod_id}]]
modId = "yet_another_config_lib_v3"
mandatory = false
versionRange = "${yacl_version_range}"
ordering = "NONE"
side = "CLIENT"

# Optional Catalogue mod list: use the square icon separately from the banner.
[modproperties.${mod_id}]
catalogueImageIcon="${mod_id}.png"
