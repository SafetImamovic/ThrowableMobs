plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

dependencies {
    // Fabric and NeoForge both bundle Fabric Mixin, so it is safe to use it in common
    // If you need to update, check what version they are using to see what is compatible
    // https://github.com/neoforged/NeoForge/blob/26.3.x/gradle.properties#L37
    // https://github.com/FabricMC/fabric-loader/blob/master/gradle.properties#L12
    compileOnly('net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7')
    // Fabric and NeoForge both bundle MixinExtras, so it is safe to use it in common
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.5.3'))

    // Pure-Java physics math. `api` so loader projects see it through their compileOnly(':common').
    // Its unit tests live in :physics; in-game behavior is covered by GameTests.
    api(project(':physics'))

    // NeoForge's config API (ModConfigSpec). NeoForge has it built in; on Fabric, Forge Config API Port provides the
    // same classes, so config specs can live in common.
    compileOnly("fuzs.forgeconfigapiport:forgeconfigapiport-common-neoforgeapi:${forgeconfigapiport_version}")
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

// Stonecutter gives each version's project more than one source directory (the branch's src/ and the version's own),
// so the loaders get one copy of everything.
def collectCommonJava = tasks.register('collectCommonJava', Sync) {
    from(sourceSets.main.java)
    into(layout.buildDirectory.dir('collected/java'))
}
def collectCommonResources = tasks.register('collectCommonResources', Sync) {
    from(sourceSets.main.resources)
    into(layout.buildDirectory.dir('collected/resources'))
    // Data pack formats the resources are written for (26.3) that older versions read differently: entity predicates
    // took the entity type as "type", and tag predicates a tag ID without the #.
    if (stonecutter.eval(stonecutter.current.version, '<26.1')) {
        filesMatching('data/*/advancement/*.json') {
            filter { String line ->
                line.replace('"minecraft:entity_type":', '"type":').replaceAll(/("id": *)"#/, '$1"')
            }
        }
    }
}

artifacts {
    commonJava(collectCommonJava.map { it.destinationDir }) { builtBy(collectCommonJava) }
    commonResources(collectCommonResources.map { it.destinationDir }) { builtBy(collectCommonResources) }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}
