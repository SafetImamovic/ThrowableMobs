pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    // Builds every Minecraft version from one source tree; see https://stonecutter.kikugie.dev
    id 'dev.kikugie.stonecutter' version '0.9.8'
}

// This should match the folder name of the project, or else IDEA may complain (see https://youtrack.jetbrains.com/issue/IDEA-317606)
rootProject.name = 'ThrowableMobs'
includeBuild('build-logic')
// Pure Java, no Minecraft classes: one build for every version.
include('physics')

// One project per branch and Minecraft version, like :fabric:26.3, built from that branch's src/. Per-version
// properties (dependency versions, Java) are in versions/<minecraft version>/gradle.properties.
stonecutter {
    create(rootProject) {
        versions('1.20.1', '1.21.1', '26.3')
        vcsVersion = '26.3'
        branch('common')
        branch('fabric')
        // NeoForge 1.20.1 is a fork of Forge 47 and runs the Forge jar, so it has no build of its own there.
        branch('neoforge') { versions('1.21.1', '26.3') }
        // MinecraftForge only where its players are; see THROWABLE_MOBS.md §2.
        branch('forge') { versions('1.20.1') }
    }
}
