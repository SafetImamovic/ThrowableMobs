plugins {
    id 'java-library'
    id 'maven-publish'
}

// Stonecutter makes one project per branch and Minecraft version, like :fabric:26.3 (named "26.3"). Its Minecraft
// version's properties come from versions/<version>/gradle.properties and override the root gradle.properties.
def versionProperties = new Properties()
rootProject.file("versions/${stonecutter.current.version}/gradle.properties").withInputStream { versionProperties.load(it) }
versionProperties.each { key, value -> project.ext.set(key, value) }
// common, fabric or neoforge
ext.platform = project.parent.name
// Every branch's project for one version is named after it (26.3), so the group tells :common:26.3 and :fabric:26.3
// apart; with the same group and name Gradle would take one for the other.
group = "${group}.${platform}"

base {
    archivesName = "${mod_id}-${platform}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Fuzs'
                url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
            }
        }
        filter {
            includeGroup('fuzs.forgeconfigapiport')
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup('maven.modrinth')
        }
    }
}

dependencies {
    // @Nullable; Minecraft brings it from 26.1 on, older versions don't.
    compileOnly('org.jspecify:jspecify:1.0.0')
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : platform,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                      : version,
            'group'                        : project.group, //Else we target the task's group.
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'minecraft_version_range_fabric': minecraft_version_range_fabric,
            'fabric_loader_requirement'    : fabric_loader_requirement,
            'fabric_api_requirement'       : fabric_api_requirement,
            'forgeconfigapiport_requirement': forgeconfigapiport_requirement,
            // Each version has NeoForge or Forge (1.20.1), not both; the other's keys are empty.
            'neoforge_version_range'       : findProperty('neoforge_version_range') ?: '',
            'forge_version_range'          : findProperty('forge_version_range') ?: '',
            'forge_loader_version_range'   : findProperty('forge_loader_version_range') ?: '',
            'yacl_requirement'             : yacl_requirement,
            'yacl_version_range'           : yacl_version_range,
            'fabric_version'               : fabric_version,
            'fabric_loader_version'        : fabric_loader_version,
            'forgeconfigapiport_version'   : forgeconfigapiport_version,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.description,
            'neoforge_version'             : findProperty('neoforge_version') ?: '',
            'forge_version'                : findProperty('forge_version') ?: '',
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'credits'                      : credits,
            'java_version'                 : java_version,
            'homepage'                     : homepage,
            'sources'                      : sources,
            'issues'                       : issues,
            'donate'                       : donate
    ]

    var jsonExpandProps = expandProps.collectEntries {
        key, value -> [(key): value instanceof String ? value.replace('\n', '\\\\n') : value]
    }

    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }

    // NeoForge before 26.1 exposes one logo/banner; the separate iconFile/bannerFile fields came later.
    if (stonecutter.eval(stonecutter.current.version, '<26.1')) {
        filesMatching('META-INF/neoforge.mods.toml') {
            filter { String line ->
                line.startsWith('iconFile=') ? null : line.replace('bannerFile=', 'logoFile=')
            }
        }
    }

    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand jsonExpandProps
    }

    // Mixins (and entrypoints) whose classes only exist in some Minecraft versions, with the versions they're for; the
    // other versions' mixin configs and fabric.mod.json leave their line out (so none of them may be the last entry of
    // a list or object).
    def versionedClasses = ['LivingEntityRenderStateMixin': '>=1.21.2', 'KeyMappingMixin': '<26.1',
                            'CriteriaTriggersInvoker': '<1.20.2', 'EntityStateMixin': '<1.20.5',
                            'ModMenuIntegration': '<1.20.2']
    filesMatching(['*.mixins.json', 'fabric.mod.json']) {
        filter { String line ->
            versionedClasses.any { name, versions ->
                (line.contains("\"${name}\"") || line.contains(".${name}\""))
                        && !stonecutter.eval(stonecutter.current.version, versions)
            } ? null : line
        }
    }

    inputs.properties(expandProps)
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url System.getenv('local_maven_url')
        }
    }
}

// Sources are UTF-8; Java 17 (1.20.1) would read them in the system encoding, which on Windows isn't.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Don't demand @param/@return on every method; still report real javadoc errors.
tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
}
