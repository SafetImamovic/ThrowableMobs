# Important Notes:
# Every field you add must be added to build-logic/src/main/groovy/multiloader-common.gradle expandProps map.
# Per Minecraft version properties (minecraft_version, dependency versions, java_version) are in
# versions/<minecraft version>/gradle.properties.

# Project
version=0.7.0
group=io.github.safetimamovic.throwablemobs
# For :physics, which every version compiles from source, so it's the oldest version's Java; versioned projects use
# their version's java_version.
java_version=17

# Common
mod_name=Throwable Mobs
mod_author=SafetImamovic
mod_id=throwablemobs
license=MIT
credits=
description=Pick up mobs and throw them. Creepers explode on impact, endermen blink away, slimes split, and your friends can catch them mid-air.
homepage=https://github.com/SafetImamovic/ThrowableMobs
sources=https://github.com/SafetImamovic/ThrowableMobs
issues=https://github.com/SafetImamovic/ThrowableMobs/issues
donate=https://ko-fi.com/safetimamovic

# Fabric Loader works across Minecraft versions, see https://fabricmc.net/develop/ for new versions
fabric_loader_version=0.19.5

# NeoForge
neoforge_loader_version_range=[4,)

# Testing
junit_version=5.13.4

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
