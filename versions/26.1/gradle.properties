# Everything that changes with the Minecraft version. Read into every :common, :fabric and :neoforge project of this
# version by build-logic (multiloader-common.gradle).
minecraft_version=26.1.2
# NeoForge (Maven range) and Fabric (fabric.mod.json) syntax
minecraft_version_range=[26.1.2, 26.2)
minecraft_version_range_fabric=>=26.1.2 <26.2
java_version=25
## NeoForm = vanilla Minecraft for the 'common' project, see https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.1.2-1

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.155.3+26.1.2
# Forge Config API Port: NeoForge's config system on Fabric (and for common), see https://modrinth.com/mod/forge-config-api-port
forgeconfigapiport_version=26.1.5
# Mod Menu: dev runtime only, to open the config screen on Fabric
# Optional config screen, see https://modrinth.com/mod/yacl/versions
yacl_version=3.9.7+26.1
modmenu_version=18.0.2

# Ragdollified 1.1.1: compile only, for the optional ragdolls in flight. Modrinth version ID, because the
# version number is the same for every Minecraft version, see https://modrinth.com/mod/ragdollified/versions
ragdollified_version=oZglXnOd

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.1.2.125

# What players need, which can be older than what the mod is built against (above).
fabric_loader_requirement=>=0.19.5
fabric_api_requirement=*
forgeconfigapiport_requirement=>=26.1.5
yacl_requirement=>=3.9.7
yacl_version_range=[3.9.7,)
neoforge_version_range=[26.1.2.125,)
