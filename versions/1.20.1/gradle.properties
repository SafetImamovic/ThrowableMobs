# Everything that changes with the Minecraft version. Read into every :common, :fabric and :forge project of this
# version by build-logic (multiloader-common.gradle).
minecraft_version=1.20.1
# Forge (Maven range) and Fabric (fabric.mod.json) syntax
minecraft_version_range=[1.20.1, 1.20.2)
minecraft_version_range_fabric=1.20.1
java_version=17
## MCP config = vanilla Minecraft for the 'common' project on Forge's toolchain (NeoForm starts at 1.20.2), see
## https://maven.minecraftforge.net/de/oceanlabs/mcp/mcp_config/
mcp_version=1.20.1

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.92.12+1.20.1
# Forge Config API Port: Forge's config system on Fabric (and for common). Before 1.20.2 it ports Forge's
# ForgeConfigSpec, not NeoForge's ModConfigSpec. See https://modrinth.com/mod/forge-config-api-port
forgeconfigapiport_version=8.0.3
# Optional config screen, see https://modrinth.com/mod/yacl/versions
yacl_version=3.6.6+1.20.1
# Mod Menu: dev runtime only, to open the config screen on Fabric
modmenu_version=7.2.2

# Forge, see https://files.minecraftforge.net/net/minecraftforge/forge/index_1.20.1.html for new versions
forge_version=1.20.1-47.4.28

# What players need, which can be older than what the mod is built against (above).
fabric_loader_requirement=>=0.15.0
fabric_api_requirement=>=0.92.0
forgeconfigapiport_requirement=>=8.0.0
yacl_requirement=>=3.6.6
yacl_version_range=[3.6.6,)
forge_version_range=[47.1,)
forge_loader_version_range=[47,)
