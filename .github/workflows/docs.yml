# Builds the VitePress site from docs/ and deploys it to GitHub Pages on release tags (v*), or by hand (Actions → Docs →
# Run workflow): https://safetimamovic.github.io/ThrowableMobs/
# The github-pages environment must allow v* tags (Settings → Environments → github-pages → Deployment branches and tags).
name: Docs

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; don't cancel one that's running.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # "Last updated" on each page comes from git history

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run docs:build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
