# Pushing a tag like v0.1.0 builds both loaders and creates a GitHub Release with the two jars, their sources and the
# version's section of CHANGELOG.md. Then modrinth.yml publishes that release to Modrinth. See CONTRIBUTING.md,
# "Releasing".
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against gradle.properties
        id: version
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version=$version in gradle.properties"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # 0.x and versions like 0.2.0-beta.1 are pre-releases.
          if [[ "$version" == 0.* || "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Take the version's section of CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section, or it's empty"
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build

      - uses: softprops/action-gh-release@v3
        with:
          name: Throwable Mobs ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ steps.version.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            fabric/versions/*/build/libs/throwablemobs-fabric-*-${{ steps.version.outputs.version }}.jar
            fabric/versions/*/build/libs/throwablemobs-fabric-*-${{ steps.version.outputs.version }}-sources.jar
            neoforge/versions/*/build/libs/throwablemobs-neoforge-*-${{ steps.version.outputs.version }}.jar
            neoforge/versions/*/build/libs/throwablemobs-neoforge-*-${{ steps.version.outputs.version }}-sources.jar

  # One Modrinth version per loader, from the release just made (modrinth.yml).
  modrinth:
    needs: release
    uses: ./.github/workflows/modrinth.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
