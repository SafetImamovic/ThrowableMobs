# Pushing a tag like v0.1.0 builds both loaders and creates a GitHub Release with the two jars, their sources and the
# version's section of CHANGELOG.md. Then it publishes one Modrinth version per loader, once the repository has the
# MODRINTH_ID variable and the MODRINTH_TOKEN secret. See CONTRIBUTING.md, "Releasing".
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against gradle.properties
        id: version
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version=$version in gradle.properties"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # 0.x and versions like 0.2.0-beta.1 are pre-releases.
          if [[ "$version" == 0.* || "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Take the version's section of CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section, or it's empty"
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build

      - uses: softprops/action-gh-release@v3
        with:
          name: Throwable Mobs ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ steps.version.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            fabric/build/libs/throwablemobs-fabric-*-${{ steps.version.outputs.version }}.jar
            fabric/build/libs/throwablemobs-fabric-*-${{ steps.version.outputs.version }}-sources.jar
            neoforge/build/libs/throwablemobs-neoforge-*-${{ steps.version.outputs.version }}.jar
            neoforge/build/libs/throwablemobs-neoforge-*-${{ steps.version.outputs.version }}-sources.jar

      # For the modrinth job: the mod jars with their sources, and the release notes.
      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: |
            fabric/build/libs/throwablemobs-fabric-*-${{ steps.version.outputs.version }}.jar
            fabric/build/libs/throwablemobs-fabric-*-${{ steps.version.outputs.version }}-sources.jar
            neoforge/build/libs/throwablemobs-neoforge-*-${{ steps.version.outputs.version }}.jar
            neoforge/build/libs/throwablemobs-neoforge-*-${{ steps.version.outputs.version }}-sources.jar
            release-notes.md
          if-no-files-found: error

  # One Modrinth version per loader. Skipped until the repository has the MODRINTH_ID variable (the project's ID:
  # Modrinth project page, three-dot menu, Copy ID) and the MODRINTH_TOKEN secret (a Modrinth personal access token with
  # the "Create versions" scope).
  modrinth:
    needs: release
    if: vars.MODRINTH_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Each upload stands alone; one failing doesn't cancel the other.
      fail-fast: false
      matrix:
        include:
          - minecraft: '26.3'
            loader: fabric
            java: 25
            dependencies: |
              fabric-api(required){modrinth:P7dR8mSH}
              forgeconfigapiport(required){modrinth:ohNO6lps}
          - minecraft: '26.3'
            loader: neoforge
            java: 25
            dependencies: ''
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-files

      # Pinned to v3.3.1's commit: this action gets the Modrinth token.
      - uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          # The first file is the one players download; the sources jar goes with it.
          files: |
            ${{ matrix.loader }}/build/libs/throwablemobs-${{ matrix.loader }}-${{ matrix.minecraft }}-${{ needs.release.outputs.version }}.jar
            ${{ matrix.loader }}/build/libs/throwablemobs-${{ matrix.loader }}-${{ matrix.minecraft }}-${{ needs.release.outputs.version }}-sources.jar
          name: Throwable Mobs ${{ needs.release.outputs.version }} (${{ matrix.loader == 'fabric' && 'Fabric' || 'NeoForge' }} ${{ matrix.minecraft }})
          version: ${{ needs.release.outputs.version }}
          version-type: ${{ needs.release.outputs.prerelease == 'true' && 'beta' || 'release' }}
          changelog-file: release-notes.md
          loaders: ${{ matrix.loader }}
          game-versions: ${{ matrix.minecraft }}
          java: ${{ matrix.java }}
          dependencies: ${{ matrix.dependencies }}
