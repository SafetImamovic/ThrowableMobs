# Builds both loaders and runs the tests on every push to master and every pull request. The jars are attached to
# the run as an artifact, so a PR can be tested in game without building it locally.
name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Also checks that the Gradle wrapper jar is the real one.
      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build

      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: throwablemobs-jars
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
            !**/*-sources.jar
            !**/*-javadoc.jar
          if-no-files-found: error
